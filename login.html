<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Câmera</title>
</head>
<body>

<h2>Câmera do dispositivo</h2>

<video id="camera" width="400" autoplay playsinline></video>

<script>
async function iniciarCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        document.getElementById("camera").srcObject = stream;
    } catch (erro) {
        alert("Não foi possível acessar a câmera.");
        console.error(erro);
    }
}

iniciarCamera();
</script>

</body>
</html>
