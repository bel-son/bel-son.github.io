<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projeto Software</title>
  
  
  <link rel="stylesheet" href="style.cs">
<style>
  body{
  font-family: 'Times New Roman', Times, serif;
  font-style: italic;
  background: black;
}
header{
  display: flex;
  width: 80%;
  flex-flow: row wrap;
  margin: auto auto;
  margin-bottom: 30px;
}
input{
  padding: 10px 0px 10px 0px;
  width: 78%;
  font-size: 17px;
  background: black;
  color: white;
  font-family: 'Times New Roman', Times, serif;
  font-style: italic;
}
button.bota{
  border: none;
  padding: 10px 0px 10px 0px;
  background: #505ACD;
  width: 20%;
  border-bottom-right-radius: 4px;
  border-top-right-radius: 4px;
  font-size: 15px;
  font-family: 'Times New Roman', Times, serif;
  font-style: italic;
}
.topo{
  background: #E4E4E4;
  display: block;
  border: 1px solid black;
  margin: 20px 0px 20px 0px;
}
.delete{
  background: #37FF2E;
  width: 100%;
  border: none;
}
.para{
  text-align: center;
  display: inline-block;
  padding: 10px 0px 10px 0px;
  font-family: 'Times New Roman', Times, serif;
}
.olho{
  display: flex;
}
</style>
</head>
<body>
  
  <h2 style="color: white; text-align: center;">Escreva seu Comentário</h2>
  
  <header>
    
    <input type="text" id="inputTarefa" placeholder="Comentário sobre o site">
    <button class="bota" id="btnd-add" onclick="addtarefa()" type="submit">Enviar</button>
  </header>
  
  <main id="arialista">
      
  </main>

  
  
  
  <script>
    let input = document.getElementById("inputTarefa");
    let btnadd = document.getElementById("btn-add");
    let main = document.getElementById("arialista");
  
function addtarefa(){
  let valorinput = input.value;
  
  
  if ((valorinput !== "") && (valorinput !== null)) {
    let novoitem = `<div class="topo">
      <div  class="para">
        ${valorinput}
      </div>
      
      <div class="olho">
        
        <button class="delete" id="novo"></button>
      </div>
    </div>`;
    
    main.innerHTML += novoitem;
    input.value="";
    
  }
  
  
}
  </script>
  
</body>
</html>
